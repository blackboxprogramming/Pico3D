name: CMake

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: CMake Build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            gamescom: 'OFF'
          - variant: gamescom
            gamescom: 'ON'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: code
          persist-credentials: false

      - name: Checkout PicoSystem SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pimoroni/picosystem
          ref: 9a26b2adbebaf4cbf0cb646fa542304202996cb4 # v2.0.0
          path: picosystem
          persist-credentials: false

      - name: Checkout Pico SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 079c6f39023649b154152db30f1d781e884879bc # 2.3.1
          path: pico-sdk
          submodules: true
          persist-credentials: false

      - name: Install Arm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-setuptools

      - name: Build PicoSystem firmware
        run: |
          cmake -S code -B build -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICOSYSTEM_DIR="$GITHUB_WORKSPACE/picosystem" \
            -DPICO_BOARD=pimoroni_picosystem \
            -DGAMESCOM=${{ matrix.gamescom }}
          cmake --build build --parallel 2
          test -s build/pico3d.uf2
          test -s build/pico3d.elf

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build/pico3d.uf2
            build/pico3d.elf
          if-no-files-found: error
